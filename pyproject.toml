[project]
name = "yamd"
version = "0.1.0"
description = "Yet Another Media Downloader - download and convert media from the command line, a GUI, or an HTTP API."
authors=[{ name = "Flavien Lallemant" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "yt-dlp>=2024.1.1",
    "gallery-dl>=1.27.0",
    "typer>=0.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
gui-qt = [
    "PyQt6>=6.7.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",        # test FastAPI with async client
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
yamd = "yamd.interfaces.cli.main:app"

[project.entry-points."yamd.plugins.sources"]
ytdlp     = "yamd.plugins.sources.ytdlp:YtDlpPlugin"
gallerydl = "yamd.plugins.sources.gallerydl:GalleryDlPlugin"

[project.entry-points."yamd.plugins.formats"]
ffmpeg = "yamd.plugins.formats.ffmpeg:FfmpegPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/yamd"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
src = ["src"]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["yamd"]
 
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
pretty = true
 
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/yamd --cov-report=term-missing -q"
 
[tool.coverage.run]
source = ["src/yamd"]
omit = ["*/interfaces/gui/*"]  # GUI requires a display, skip in CI